<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMIKT Medication Price Checker</title>
    <link rel="icon" href="kmikt.ico">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Google Sans', sans-serif;
            text-align: center;
            background: #fafafa;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        main {
            flex: 1;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            padding: 20px;
        }

        .header img {
            height: 100px;
            margin-right: 15px;
        }

        .search-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            gap: 10px;
        }

        input {
            padding: 12px;
            width: 350px;
            font-size: 18px;
            border-radius: 10px;
            border: 1px solid #ccc;
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        input:focus {
            box-shadow: 0 0 0 1px rgba(67, 193, 175, 1);
        }

        button {
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background: #19b09b;
            color: white;
            border-radius: 10px;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        button:hover {
            background: #24559c;
            transform: scale(1);
        }

        .dropdown {
            position: absolute;
            width: 460px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            display: none;
            overflow-y: auto;
            max-height: 350px;
            text-align: left;
            margin-top: 5px;
            left: 50%;
            scroll-behavior: smooth;
            transform: translateX(-50%);
        }

        .dropdown div {
            padding: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .dropdown div:hover,
        .dropdown div.selected {
            background: #e5e5ea;
        }

        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
            display: none;
            text-align: center;
            width: 320px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .popup button {
            margin-top: 15px;
            width: 100%;
            background: #ff3b30;
            color: white;
            border: none;
            padding: 12px;
            cursor: pointer;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #E5E5E5;
            color: #808080;
            font-size: 0.9em;
        }

        #searchBox {
            font-family: 'Google Sans', sans-serif;
        }

        .last-updated {
            color: #929191;
            font-style: italic;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="Logo.png" alt="KMIKT Logo">
        Medication Price Checker
    </div>
    <main>
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="Search drug...">
        </div>

        <div class="dropdown" id="dropdown" aria-live="polite"></div>
        <div class="popup" id="popup"></div>
    </main>
    <script>
        const sheetId = "1q00xN4aWHpD1GQSrRQHJ7sGBFqMY9I1DhgipVmtUmks";
        const apiKey = "AIzaSyBMLUgjwly8tegx2EcnM7On2aN00Ek7v6Y";
        const apiUrl = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A:E?key=${apiKey}`;
        let medicines = [];

        function fetchDataFromSheets() {
            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error: ${response.status}`);
                    }

                    return response.json();
                })
                .then(data => {

                    if (!data.values || data.values.length < 2) {
                        console.warn("No medication data available.");
                        return;
                    }

                    medicines = data.values.slice(1).map(row => ({
                        name: row[0] || "",
                        oum: row[1] || "",
                        op: row[2] || "",
                        ip: row[3] || "",
                        updated: row[4] || ""
                    }));

                    console.log("Data updated:", medicines);
                })
                .catch(error => {
                    console.error("Error fetching data:", error);
                });
        }

        fetchDataFromSheets();

        setInterval(fetchDataFromSheets, 60000);

        const searchBox = document.getElementById("searchBox");
        const dropdown = document.getElementById("dropdown");
        const popup = document.getElementById("popup");
        let selectedIndex = -1;

        searchBox.addEventListener("input", function () {
            if (popup.style.display === "block") {
                closePopup();
            }
            const query = searchBox.value.toLowerCase().trim();
            if (query.length < 2) {
                dropdown.style.display = "none";
                return;
            }
            const filtered = medicines.filter(med => med.name.toLowerCase().includes(query)).slice(0, 10);
            dropdown.innerHTML = filtered.map((med, index) =>
                `<div data-index="${index}" class="${index === 0 ? 'selected' : ''}">${med.name}</div>`
            ).join("");
            dropdown.style.display = filtered.length ? "block" : "none";
            selectedIndex = 0;
        });

        searchBox.addEventListener("keydown", function (e) {
            const items = dropdown.children;
            if (e.key === "ArrowDown" && selectedIndex < items.length - 1) {
                selectedIndex++;
            } else if (e.key === "ArrowUp" && selectedIndex > 0) {
                selectedIndex--;
            } else if (e.key === "Enter" && selectedIndex >= 0 && searchBox.value.trim() !== "") {
                showPopup(items[selectedIndex].textContent);
            }

            Array.from(items).forEach((item, index) => {
                item.classList.toggle("selected", index === selectedIndex);
                if (index === selectedIndex) {
                    item.scrollIntoView({ block: "nearest" });
                }
            });
        });

        dropdown.addEventListener("click", function (e) {
            if (e.target.tagName === "DIV") {
                showPopup(e.target.textContent);
            }
        });

        function showPopup(medicineName) {
            if (!medicineName) return;
            const medicine = medicines.find(m => m.name === medicineName);
            if (medicine) {
                popup.innerHTML = `
                    <strong>${medicine.name}</strong><br>
                    <br>
                    <strong>Unit of Measure:</strong> ${medicine.oum}
                    <br>
                    <strong>Outpatient Price:</strong> RM${medicine.op}
                    <br>
                    <strong>Inpatient Price:</strong> RM${medicine.ip}
                    <br><br>
                    <span class="last-updated">Last Updated: ${medicine.updated}</span>
                    <br><br>
                    <button onclick="closePopup()">Close</button>
                `;
                popup.style.display = "block";
                setTimeout(() => { popup.style.opacity = 1; }, 10);
            }
            dropdown.style.display = "none";
            searchBox.value = "";
        }

        function closePopup() {
            popup.style.opacity = 0;
            setTimeout(() => {
                popup.style.display = "none";
            }, 300);
        }

        window.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        }, false);

        document.onkeydown = function (e) {
            if (e.keyCode === 123) {
                return false;
            }
            if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) {
                return false;
            }
            if (e.ctrlKey && e.keyCode === 85) {
                return false;
            }

            if (e.key === "Escape" && popup.style.display === "block") {
                closePopup();
            }
        };
    </script>

    <footer>
		<p style=>Owned by Kuala Terengganu Specialist Sdn Bhd 19970101783 (427280-X)</p>
    </footer>
</body>

</html>
